<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The SHELL gene</title><style>
.iso{

}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;

  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(860px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.sg {
  --sg-meso: #e8954a;
  --sg-meso-on: #f59a1f;
  --sg-exo: #6e2a1d;
  --sg-skin-0: #5c241a;
  --sg-skin-1: #74301f;
  --sg-skin-2: #8f3d24;
  --sg-skin-3: #a9512c;
  --sg-skin-top: #b8613a;
  --sg-shell: #4b3628;
  --sg-testa: #8a6444;
  --sg-kernel: #f6f1e4;
  --sg-fibre: #b5641f;
  --sg-leaf: #8db265;
  --sg-leaf-edge: #5f8540;
  --sg-soil: #7a6551;
  --sg-earth: #b8a58c;
  --sg-oil: #ec9330;
  --sg-glass: #e8eef0;
  --sg-screen: #1f2a24;
  --sg-screen-text: #9cf0b8;
  --sg-go: #2f9e63;
  --sg-stop: #d6403d;
  --sg-amber: #d9902a;
  --sg-off: #cfcfd1;
}
.iso[data-theme="dark"] .sg {
  --sg-meso: #c9741f;
  --sg-meso-on: #ff9c24;
  --sg-kernel: #e2dccd;
  --sg-leaf: #5f8a3d;
  --sg-leaf-edge: #8fbf68;
  --sg-soil: #4a3c30;
  --sg-earth: #3a3128;
  --sg-glass: #1d2326;
  --sg-screen: #0a0f0c;
  --sg-off: #2e2e2e;
}
.sg .iso-plate { overflow: hidden; }
.sg-credit {
  position: absolute; top: 34px; right: 20px; color: var(--anatomy-muted);
  font-family: var(--anatomy-mono); font-size: 9.5px; letter-spacing: .06em; line-height: 1; pointer-events: none;
}
.sg-stage { position: relative; margin: 6px -8px 0; touch-action: pan-y; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; cursor: default; }
.sg-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.sg-stage > svg { display: block; width: 100%; height: auto; }

/* seedlings */
.sg-leaf { fill: var(--sg-leaf); stroke: var(--sg-leaf-edge); stroke-width: .55; stroke-linejoin: round; }
.sg-rib { stroke: var(--sg-leaf-edge); stroke-width: .4; opacity: .7; }
.sg-soil { fill: var(--sg-soil); stroke: var(--anatomy-lo); stroke-width: .4; }
.sg-stem { fill: var(--sg-leaf-edge); stroke: none; }
.sg-hole { fill: var(--anatomy-card); stroke: var(--sg-leaf-edge); stroke-width: .45; opacity: 0; }
.sg-seedling[data-punched] .sg-hole { opacity: 1; }

/* sample plate, DNA unit */
.sg-sample { fill: var(--sg-off); stroke: none; opacity: 0; transition: opacity .3s, fill .3s; }
.sg-sample[data-filled] { opacity: 1; fill: var(--sg-leaf); }
.sg-sample[data-form="tenera"] { fill: var(--sg-go); }
.sg-sample[data-form="dura"] { fill: var(--sg-stop); }
.sg-sample[data-form="pisifera"] { fill: var(--sg-amber); }
.sg-screen { fill: var(--sg-screen); stroke: none; }
.sg-screen-text { fill: var(--sg-screen-text); font-family: var(--anatomy-mono); letter-spacing: 0; }
.sg-led { fill: var(--sg-off); stroke: var(--anatomy-lo); stroke-width: .3; transition: fill .25s; }
.sg-led[data-led="tenera"][data-on] { fill: var(--sg-go); }
.sg-led[data-led="dura"][data-on] { fill: var(--sg-stop); }
.sg-led[data-led="pisifera"][data-on] { fill: var(--sg-amber); }
.sg-read { fill: var(--sg-off); stroke: none; transition: fill .2s; }
.sg-read[data-on] { fill: var(--sg-screen-text); }
.sg-disc { fill: var(--sg-leaf); stroke: var(--anatomy-lit); stroke-width: .5; }

/* fruits */
.sg-skin .iso-solid > .iso-shade[data-shade="0"] { fill: var(--sg-skin-0); stroke: var(--sg-skin-0); }
.sg-skin .iso-solid > .iso-shade[data-shade="1"] { fill: var(--sg-skin-1); stroke: var(--sg-skin-1); }
.sg-skin .iso-solid > .iso-shade[data-shade="2"] { fill: var(--sg-skin-2); stroke: var(--sg-skin-2); }
.sg-skin .iso-solid > .iso-shade[data-shade="3"] { fill: var(--sg-skin-3); stroke: var(--sg-skin-3); }
.sg-skin .iso-solid > .iso-top { fill: var(--sg-skin-top); stroke: var(--sg-skin-top); }
.sg-skin .iso-fill { fill: var(--sg-skin-1); }
.sg-skin .iso-line { display: none; }
.sg-face path { vector-effect: non-scaling-stroke; }
.sg-exo { fill: var(--sg-exo); stroke: none; }
.sg-meso { fill: var(--sg-meso); stroke: none; transition: fill .4s; }
.sg-fibre { fill: none; stroke: var(--sg-fibre); stroke-width: .5; opacity: .55; }
.sg-fibre-ring { fill: none; stroke: var(--sg-fibre); stroke-width: 1.1; stroke-dasharray: 1.2 1; }
.sg-shell { fill: var(--sg-shell); stroke: none; }
.sg-testa { fill: var(--sg-testa); stroke: none; }
.sg-kernel { fill: var(--sg-kernel); stroke: none; }
.sg-embryo { fill: var(--sg-testa); stroke: none; opacity: .6; }
.sg-pore { fill: var(--sg-kernel); stroke: none; opacity: .5; }
.sg-cutline { fill: none; stroke: var(--anatomy-hi); stroke-width: .6; }
.sg-rim { transition: stroke .3s; }
.sg-fruit[data-on] .sg-meso { fill: var(--sg-meso-on); }
.sg-fruit[data-on] .sg-rim, .sg-fruit[data-on] .sg-cutline { stroke: var(--anatomy-lit); stroke-width: 1.1; }
.sg-glow { fill: var(--sg-meso-on); filter: blur(7px); opacity: 0; transition: opacity .4s; }
.sg-glow[data-on] { opacity: .55; }
.sg-lamp { fill: var(--sg-off); transition: fill .3s; }
.sg-lamp[data-on] { fill: var(--sg-meso-on); }
.sg-name, .sg-geno { letter-spacing: .06em; }

/* chutes */
.sg-gate-led { fill: var(--sg-off); transition: fill .25s; }
.sg-gate-led[data-state="tenera"] { fill: var(--sg-go); }
.sg-gate-led[data-state="reject"] { fill: var(--sg-stop); }
.sg-bin-floor { fill: var(--anatomy-shade-0); stroke: none; }
.sg-chute-label { letter-spacing: .08em; }

/* plot and columns */
.sg-earth { fill: var(--sg-earth); stroke: var(--anatomy-lo); stroke-width: .6; }
.sg-frond { fill: none; stroke: var(--sg-leaf-edge); stroke-width: .9; stroke-linecap: round; }
.sg-bunch { fill: var(--sg-oil); stroke: var(--sg-exo); stroke-width: .35; transition: r .4s, opacity .4s; }
.sg-mark { fill: none; stroke: var(--sg-stop); stroke-width: 1.1; opacity: 0; transition: opacity .4s; }
.sg-palm[data-form="dura"] .sg-bunch { r: 1.5; fill: var(--sg-exo); }
.sg-palm[data-form="pisifera"] .sg-bunch { opacity: 0; }
.sg-palm[data-form="dura"] .sg-mark, .sg-palm[data-form="pisifera"] .sg-mark { opacity: .9; }
.sg-oil-g .iso-fill, .sg-oil-g .iso-shade, .sg-oil-g .iso-top { fill: var(--sg-oil); stroke: var(--sg-oil); }
.sg-oil-g .iso-top { fill: var(--sg-meso-on); }
.sg-oil-g .iso-edge { stroke: var(--sg-fibre); }
.sg-glass .iso-fill { fill: var(--sg-glass); fill-opacity: .25; }
.sg-glass .iso-shade, .sg-glass .iso-top { fill-opacity: .18; }
.sg-glass[data-on] .iso-edge { stroke: var(--anatomy-lit); }

/* the panel under the drawing */
.sg-panel { display: grid; gap: 14px; margin: 8px 0 6px; }
.sg-toggle { display: inline-flex; justify-self: start; box-shadow: 0 0 0 1px var(--anatomy-mid); }
.sg-toggle button {
  appearance: none; border: 0; margin: 0; padding: 7px 12px; cursor: pointer;
  background: transparent; color: var(--anatomy-muted); font: 11px/1 var(--anatomy-mono); letter-spacing: .06em; text-transform: uppercase;
}
.sg-toggle button + button { box-shadow: -1px 0 0 0 var(--anatomy-mid); }
.sg-toggle button[aria-pressed="true"] { background: var(--anatomy-strong); color: var(--anatomy-card); }
.sg-toggle button:focus-visible { outline: 1px solid var(--anatomy-strong); outline-offset: 2px; }
.sg-stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; margin: 0; box-shadow: 0 0 0 1px var(--anatomy-faint); }
.sg-stats > div { padding: 9px 10px; box-shadow: 1px 0 0 0 var(--anatomy-faint); }
.sg-stats dt { color: var(--anatomy-muted); font: 9.5px/1.3 var(--anatomy-mono); letter-spacing: .05em; text-transform: uppercase; }
.sg-stats dd { margin: 4px 0 0; color: var(--anatomy-strong); font: 600 17px/1.1 ui-sans-serif, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
@media (max-width: 640px) {
  .sg-credit { top: 32px; right: 12px; font-size: 8.5px; max-width: 60%; text-align: right; line-height: 1.3; }
  .sg-stage { margin: 14px -8px 0; }
  .sg-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sg-toggle button { padding: 7px 8px; font-size: 10px; }

</div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Punch rod and diverter gate</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Bench, conveyor, punch, DNA unit, chutes</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Cutaway fruits: shell against the orange mesocarp</span></span><span class="iso-caption">In 2013 the Malaysian Palm Oil Board (Singh et al., Nature 500, 340–344) found SHELL, a MADS-box gene that sets the oil palm fruit's form. Two normal copies (Sh+/Sh+) give dura, with a 2–8 mm shell; two mutant copies (sh−/sh−) give pisifera, with no shell and usually female-sterile; one of each gives tenera, with a 0.5–4 mm shell and a fibre ring, and about 30% more oil per hectare than dura. Commercial tenera seed comes from dura × pisifera crosses, but stray pollen lets dura and pisifera through, and until a palm fruits, up to 6 years after planting, nobody can tell. The SHELL test reads the genotype from a leaf disc in the nursery. The lot drawn is illustrative: 24 seedlings with 3 dura and 1 pisifera. Planted unscreened, its block yields 121 on a scale where an all-dura block is 100; screened, all tenera, it yields 130. Fruits are drawn to typical proportions at about 2× life size; the assay is compressed to a few seconds.</span></figcaption></figure></div></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);

    const facing = normals.map(([nx, ny]) => nx * vx + ny * vy > 1e-9);
    const top = ring.map(([x, y]) => iso([x, y, z + height], projection));

    const outline = [];
    const crease = [];
    for (const run of runsOf(facing, false))
        outline.push(pathOf(run.map((index) => top[index])));
    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));

            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {
        for (let index = 0; index < count; index++) {
            if (facing[(index + count - 1) % count] !== facing[index])

        }
    }
    let fill;
    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const [nx, ny] = normals[index];
            const lit = (nx * lx + ny * ly + 1) / 2;
            const shade = Math.min(SHADES - 1, Math.max(0, Math.floor(lit * SHADES)));
            const next = (index + 1) % count;
            buckets[shade].push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }

// The SHELL gene (Singh et al., Nature 500, 340–344, 2013) as a small pure model.
// One gene, two alleles: Sh+ (normal) and sh- (either of the two mutations MPOB found
// in the MADS-box, sh-MPOB and sh-AVROS). The fruit form follows the genotype.

const FORMS = {
  dura: { genotype: "Sh+/Sh+", copies: 0, shell: "thick, 2–8 mm", oil: 1.0, plant: false },
  tenera: { genotype: "Sh+/sh-", copies: 1, shell: "thin, 0.5–4 mm, with a fibre ring", oil: 1.3, plant: true },
  pisifera: { genotype: "sh-/sh-", copies: 2, shell: "none; usually female-sterile", oil: 0, plant: false },
};

const ORDER = ["dura", "tenera", "pisifera"];

// Tenera yields about 30% more oil per hectare than dura. Pisifera palms are usually
// female-sterile: their bunches abort, so they carry no oil to the mill.
const UPLIFT = FORMS.tenera.oil / FORMS.dura.oil - 1;

// Without the test, the form shows only when the palm first fruits.
const YEARS_TO_FRUIT = 6;

// An illustrative seed lot sold as tenera (dura × pisifera), with stray pollen giving
// three dura and one pisifera in 24. The bench screens it seedling by seedling.
const LOT = "TTDTTTTPTTTDTTTTTTDTTTTT".split("").map((c) => ({ T: "tenera", D: "dura", P: "pisifera" })[c]);

function countsOf(forms) {
  const out = { dura: 0, tenera: 0, pisifera: 0 };
  for (const form of forms) out[form]++;
  return out;
}

// Oil per hectare of a block, relative to a block of dura palms (= 100).
function yieldOf(forms) {
  if (!forms.length) return 0;
  return (100 * forms.reduce((sum, form) => sum + FORMS[form].oil, 0)) / forms.length;
}

const UNSCREENED = yieldOf(LOT);
const SCREENED = yieldOf(LOT.filter((form) => FORMS[form].plant));

function readoutOf({ screened, counts }) {
  return `${screened} screened · T ${counts.tenera} · D ${counts.dura} · P ${counts.pisifera}`;
}

const root = document.querySelector(".sg");
const stage = root.querySelector(".sg-stage");
const svg = stage.querySelector("svg");
const readout = root.querySelector("[data-readout]");
const part = (name) => svg.querySelector(`[data-part="${name}"]`);
const still = matchMedia("(prefers-reduced-motion: reduce)");
const P = D.P;
const at = (p) => iso(p, P);
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const ease = (a, b, t) => {
  const x = clamp01((t - a) / (b - a));
  return x * x * (3 - 2 * x);
};
const bump = (a, b, t) => Math.sin(Math.PI * clamp01((t - a) / (b - a)));
const NS = "http://www.w3.org/2000/svg";
const LOT_N = LOT.length;
const formOf = (i) => LOT[((i % LOT_N) + LOT_N) % LOT_N];
const rejected = (form) => !FORMS[form].plant;

const belt = part("belt");
const slats = part("slats");
const rod = part("rod");
const platePart = part("plate");
const gate = part("gate");
const disc = part("disc");
const riders = { divert: part("riders-divert"), tenera: part("riders-tenera"), reject: part("riders-reject") };
const wells = [...svg.querySelectorAll("[data-well]")];
const cells = [...svg.querySelectorAll("[data-cell]")];
const fruits = Object.fromEntries(ORDER.map((f) => [f, svg.querySelector(`[data-fruit="${f}"]`)]));
const glows = Object.fromEntries(ORDER.map((f) => [f, svg.querySelector(`[data-glow="${f}"]`)]));
const lamps = Object.fromEntries(ORDER.map((f) => [f, svg.querySelector(`[data-lamp="${f}"]`)]));
const leds = Object.fromEntries(ORDER.map((f) => [f, svg.querySelector(`[data-led="${f}"]`)]));
const gateLed = svg.querySelector("[data-gate-led]");
const readLed = svg.querySelector(".sg-read");
const screen1 = svg.querySelector('[data-screen="1"]');
const screen2 = svg.querySelector('[data-screen="2"]');
const palms = [...svg.querySelectorAll("[data-palm]")];
const stat = (name) => root.querySelector(`[data-stat="${name}"]`);
const buttons = [...root.querySelectorAll("[data-plant]")];
const oil = [0, 1].map((i) => svg.querySelector(`[data-oil="${i}"]`));
const glass = [0, 1].map((i) => svg.querySelector(`[data-glass="${i}"]`));

// The route the disc takes from the punch, resampled by length for even speed.
const route = D.ROUTE;
const lengths = [0];
for (let i = 1; i < route.length; i++) lengths.push(lengths[i - 1] + Math.hypot(route[i][0] - route[i - 1][0], route[i][1] - route[i - 1][1], route[i][2] - route[i - 1][2]));
function along(share) {
  const want = share * lengths[lengths.length - 1];
  let i = 1;
  while (i < lengths.length - 1 && lengths[i] < want) i++;
  const t = (want - lengths[i - 1]) / Math.max(1e-6, lengths[i] - lengths[i - 1]);
  return route[i - 1].map((v, j) => v + (route[i][j] - v) * clamp01(t));
}

// ------------------------------------------------------------ state
// Cycle c: the belt advances, item c reaches the punch, its disc goes to well c, it is read.
// Item i sits at belt position c - i + 1 + advance; item c - 6 leaves the belt for the gate.
const START = 6;
let cycle = START;
let t = 0;
let running = false;
let stepping = false;
let frame = 0;
let last = 0;
const CYCLE = 2.8;
const items = new Map();

function makeItem(i) {
  const g = document.createElementNS(NS, "g");
  g.innerHTML = D.SEEDLINGS[((i % 4) + 4) % 4];
  g.dataset.item = i;
  return { i, g, seedling: g.querySelector(".sg-seedling"), puck: g.querySelector(".sg-puck"), home: null };
}
function place(item, parent, before = null) {
  if (item.home === parent) return;
  if (before) parent.insertBefore(item.g, before);
  else parent.appendChild(item.g);
  item.home = parent;
}
function lotStart(c) {
  return c - (((c % LOT_N) + LOT_N) % LOT_N);
}
function counted(c, t) {
  // items read in the current lot by cycle c, phase t
  const first = lotStart(c);
  const done = t >= 0.9 ? c : c - 1;
  const forms = [];
  for (let i = first; i <= done; i++) forms.push(formOf(i));
  return { screened: forms.length, counts: countsOf(forms), last: done >= first ? formOf(done) : null };
}

function gateFor(c) {
  return rejected(formOf(c - 6)) ? 0.55 : -0.55;
}
let gateAngle = gateFor(START);

function draw() {
  const adv = ease(0, 0.3, t);
  // belt slats and seedlings on the belt
  slats.setAttribute("d", slatsAtLive(adv * D.PITCH + cycle * D.PITCH));
  const alive = new Set();
  for (let i = cycle - 6; i <= cycle + 2; i++) {
    const pos = cycle - i + 1 + adv;
    if (pos < -1) continue;
    let item = items.get(i);
    if (!item) {
      item = makeItem(i);
      items.set(i, item);
    }
    alive.add(i);
    const punched = i < cycle || (i === cycle && t > 0.43);
    item.seedling.toggleAttribute("data-punched", punched);
    if (i === cycle - 6) leave(item);
    else {
      const x = D.SLOT0 + pos * D.PITCH;
      place(item, belt, belt.firstChild && i > cycle - 5 ? null : null);
      item.g.setAttribute("transform", translateAlong(P, [x, D.YC, 0]));
      item.g.style.opacity = pos < 0 ? String(clamp01(pos + 1)) : "1";
      if (item.puck) item.puck.style.opacity = "1";
    }
  }
  // keep belt children in depth order: farthest (smallest x, highest i) first
  const onBelt = [...items.values()].filter((it) => it.home === belt).sort((a, b) => b.i - a.i);
  onBelt.forEach((it, n) => {
    if (belt.children[n] !== it.g) belt.insertBefore(it.g, belt.children[n] || null);
  });
  for (const [i, item] of items) if (!alive.has(i)) {
    item.g.remove();
    items.delete(i);
  }

  // punch rod
  const down = bump(0.34, 0.52, t);
  rod.setAttribute("transform", translateAlong(P, [0, 0, D.ROD_REST - D.ROD_STROKE * down]));

  // sample plate indexes so well (cycle mod 24) sits under the nozzle
  const wellOf = (c) => D.WELLS[((c % LOT_N) + LOT_N) % LOT_N];
  const from = wellOf(cycle - 1);
  const to = wellOf(cycle);
  const share = lotStart(cycle) === cycle ? ease(0.02, 0.3, t) : ease(0.05, 0.3, t);
  const wx = from[0] + (to[0] - from[0]) * share;
  const wy = from[1] + (to[1] - from[1]) * share;
  platePart.setAttribute("transform", translateAlong(P, [D.PLATE_HOME[0] - wx, D.PLATE_HOME[1] - wy, 0]));
  const first = lotStart(cycle);
  wells.forEach((w, n) => {
    const i = first + n;
    const filled = i < cycle || (i === cycle && t >= 0.83);
    w.toggleAttribute("data-filled", filled);
    const read = i < cycle || (i === cycle && t >= 0.9);
    if (read) w.dataset.form = formOf(i);
    else delete w.dataset.form;
  });

  // the disc: flash at the leaf, up into the head, along the tube, down into the well
  let dp = null;
  let da = 0;
  if (t > 0.42 && t < 0.52) {
    const lift = D.ROD_REST - D.ROD_STROKE * down;
    dp = [D.PUNCH_TIP[0], D.PUNCH_TIP[1], D.PUNCH_TIP[2] + lift - (D.ROD_REST - D.ROD_STROKE) - 0.4];
    da = 1 - ease(0.48, 0.52, t);
  } else if (t >= 0.55 && t < 0.75) {
    dp = along(ease(0.55, 0.75, t));
    da = ease(0.55, 0.57, t) * (1 - ease(0.73, 0.75, t));
  } else if (t >= 0.76 && t < 0.84) {
    const s = ease(0.76, 0.84, t);
    dp = [D.NOZZLE_TIP[0], D.NOZZLE_TIP[1], D.NOZZLE_TIP[2] + (D.PLATE_Z + 0.3 - D.NOZZLE_TIP[2]) * s];
    da = ease(0.76, 0.78, t) * (1 - ease(0.82, 0.84, t));
  }
  if (dp) {
    const [sx, sy] = at(dp);
    disc.setAttribute("cx", sx.toFixed(1));
    disc.setAttribute("cy", sy.toFixed(1));
  }
  disc.style.opacity = da.toFixed(3);
  readLed.toggleAttribute("data-on", t > 0.84 && t < 0.97);

  // the reading: screen, LEDs, the matching fruit
  const seen = counted(cycle, t);
  const form = seen.last;
  for (const f of ORDER) {
    const on = f === form;
    fruits[f].toggleAttribute("data-on", on);
    glows[f].toggleAttribute("data-on", on);
    lamps[f].toggleAttribute("data-on", on);
    leds[f].toggleAttribute("data-on", on);
  }
  screen1.textContent = form ? `SHELL ${FORMS[form].genotype.replace(/-/g, "−")}` : "SHELL";
  screen2.textContent = form ? `${form.toUpperCase()} · ${rejected(form) ? "REJECT" : "PLANT"}` : "READY";
  const text = readoutOf(seen);
  if (readout.textContent !== text) readout.textContent = text;
  stat("screened").textContent = String(seen.screened);
  stat("counts").textContent = `${seen.counts.tenera} / ${seen.counts.dura} / ${seen.counts.pisifera}`;

  // the gate swings for the seedling arriving this cycle
  const target = gateFor(cycle);
  const g = gateAngle + (target - gateAngle) * ease(0, 0.22, t);
  gate.innerHTML = gateSvg(g);
  if (t >= 0.22) gateAngle = target;
  gateLed.dataset.state = rejected(formOf(cycle - 6)) ? "reject" : "tenera";

  // the planting tray fills with the tenera that have arrived in this lot
  let arrived = 0;
  for (let i = lotStart(cycle - 6); i <= cycle - 6; i++) if (!rejected(formOf(i)) && (i < cycle - 6 || t >= 0.86)) arrived++;
  const shown = arrived === 0 ? 0 : ((arrived - 1) % cells.length) + 1;
  cells.forEach((cell, n) => (cell.style.opacity = n < shown ? "1" : "0"));
}

// Leaving the belt: onto the gate deck, down a chute, into the tray or the bin.
function leave(item) {
  const form = formOf(item.i);
  const chute = rejected(form) ? D.CHUTE.reject : D.CHUTE.tenera;
  const out = rejected(form) ? riders.reject : riders.tenera;
  const x0 = D.SLOT0 + 7 * D.PITCH;
  let p;
  let alpha = 1;
  if (t < 0.3) {
    const s = ease(0, 0.3, t);
    const x = x0 + (D.DIVERT_AT[0] - x0) * s;
    p = [x, D.YC, x > 50 ? D.DIVERT_AT[2] * ease(50, 58, x) : 0];
    place(item, x > 52 ? riders.divert : belt);
    if (item.puck) item.puck.style.opacity = String(1 - ease(38, 52, x));
  } else {
    if (item.puck) item.puck.style.opacity = "0";
    const s = ease(0.3, 0.72, t);
    const a = [D.DIVERT_AT[0], D.YC, D.DIVERT_AT[2]];
    const start = [chute.from[0], chute.from[1], chute.from[2] - D.BELT_TOP];
    const end = [chute.to[0], chute.to[1], chute.to[2] - D.BELT_TOP];
    if (s < 0.15) {
      const u = s / 0.15;
      p = a.map((v, j) => v + (start[j] - v) * u);
      place(item, riders.divert);
    } else {
      const u = (s - 0.15) / 0.85;
      p = start.map((v, j) => v + (end[j] - v) * u);
      place(item, out);
    }
    alpha = 1 - ease(0.74, 0.86, t);
    if (rejected(form)) p[2] -= 6 * ease(0.72, 0.86, t);
  }
  item.g.setAttribute("transform", translateAlong(P, p));
  item.g.style.opacity = alpha.toFixed(3);
}

function slatsAtLive(offset) {
  const out = [];
  const x0 = -196;
  const w = 252;
  const step = 10;
  for (let x = x0 + (((offset % step) + step) % step); x < x0 + w; x += step) out.push(lineOnTop([x, 4], [x, 32], D.BELT_TOP, P));
  return out.join("");
}
function gateSvg(angle) {
  const len = 14;
  const dir = [-Math.cos(angle), Math.sin(angle)];
  const n = [-dir[1], dir[0]];
  const a = D.PIVOT;
  const b = [a[0] + dir[0] * len, a[1] + dir[1] * len];
  const ring = [
    [a[0] + n[0] * 0.8, a[1] + n[1] * 0.8],
    [b[0] + n[0] * 0.8, b[1] + n[1] * 0.8],
    [b[0] - n[0] * 0.8, b[1] - n[1] * 0.8],

}

// ------------------------------------------------------------ plantation toggle
let mode = "screened";

const shownLevel = { 0: UNSCREENED, 1: SCREENED };
let fill = null;
function oilSvg(i, value) {

}

    shownLevel[i] = 0;
    fill = { i, start: performance.now() };

  } else {

  }
}
function fillTick(now) {

  const s = clamp01((now - fill.start) / 1400);
  shownLevel[fill.i] = level[fill.i] * (1 - Math.pow(1 - s, 3));

  if (s < 1) requestAnimationFrame(fillTick);
  else fill = null;
}
buttons.forEach((b) => b.addEventListener("click", () => setMode(b.dataset.plant)));

// ------------------------------------------------------------ running
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  t += dt / CYCLE;
  if (t >= 1) {
    t = 0;
    cycle++;
    if (stepping || !running) {

      draw();
      frame = 0;
      return;
    }
  }

}
function run() {
  if (still.matches) {
    // one seedling at a time, no tweening
    t = 0;
    cycle++;

    return;
  }
  if (!frame) {

    frame = requestAnimationFrame(tick);
  }
}
let stillTimer = 0;
function start() {
  running = true;

    clearInterval(stillTimer);
    run();
    stillTimer = setInterval(run, 1600);
  } else run();
}
function stop() {

  clearInterval(stillTimer);
}
stage.addEventListener("pointerenter", (e) => e.pointerType === "mouse" && start());
stage.addEventListener("pointerleave", (e) => e.pointerType === "mouse" && stop());
stage.addEventListener("pointerdown", (e) => {
  if (e.pointerType !== "mouse") running ? stop() : start();
});
stage.addEventListener("focus", start);
stage.addEventListener("blur", stop);
stage.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter") {

    stop();
    stepping = true;
    run();
  }

setMode("screened", false);
draw();
window.__sg = { setMode, start, stop, get state() { return { cycle, t, running }; }, jump(c, phase = 0) { cycle = c; t = phase; draw(); } };
